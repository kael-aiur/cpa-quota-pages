name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, e2e and dist integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build single-file artifacts
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the built artifacts
        run: npm run test:e2e

      - name: User artifact must not consume reset credits
        run: |
          ! grep -F '/rate-limit-reset-credits/consume' dist/quota.html
          grep -F '/rate-limit-reset-credits/consume' dist/quota-admin.html
          ! grep -F '/assets/' dist/quota.html
          ! grep -F '/assets/' dist/quota-admin.html

      - name: Committed dist matches a clean rebuild of the sources
        run: |
          git add -A dist
          npm run check:dist
          git diff --exit-code -- dist
