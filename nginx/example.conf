# ============================================================================
# cpa-quota-pages — deployment example for the Sub2API frontend Nginx.
#
# Scope and security model (READ BEFORE DEPLOYING):
#
#   * This configuration gates the two HTML entries and injects the CPA
#     management key server-side. It does NOT establish a server-side data
#     boundary for the /cpa/ API. /v0/management/api-call is a general
#     proxy: any user who can call /cpa/ can construct arbitrary provider
#     requests, fetch the raw /auth-files response, and hand-craft a Codex
#     reset-credit consume call. Hiding the reset button in the user page is
#     a UI affordance, not an authorization boundary. See README.md
#     "已接受的残余风险" (specification §12.2) for the six accepted risks.
#
#   * `/_sub2api_auth` must be an auth_request endpoint provided by your
#     Sub2API deployment that validates the browser's Bearer token (2xx for
#     any authenticated user).
#
#   * `/_sub2api_admin_auth` must be an auth_request endpoint provided by
#     your Sub2API deployment that returns 2xx ONLY after server-side
#     validation that the caller is an ADMINISTRATOR. The static HTML never
#     parses roles — the admin gate is exactly this endpoint.
#
#   * /etc/nginx/secrets/cpa-management-auth.conf is a server-local file,
#     NOT committed to this repository. It must contain exactly:
#
#         proxy_set_header Authorization "Bearer <CPA_MANAGEMENT_KEY>";
#
#     and must be readable only by the Nginx master/worker user (chmod 640,
#     root:nginx). This injects the CPA management key on every /cpa/ request
#     so the key string never reaches the browser.
#
#   * RELEASE TAG: both HTML files are fetched from a FIXED git tag. When a
#     new release is cut, update `v1.0.0` below (and in the README) to the
#     new tag and reload Nginx. Keep the old tag available so rollback is a
#     one-line edit back to the previous tag.
# ============================================================================

# --- Sub2API auth endpoints (provided by the deployment, not this file) ------
# Internal only; defined by the Sub2API deployment. They must validate the
# incoming `Authorization: Bearer <sub2api token>` and return 2xx on success:
#
#   /_sub2api_auth        -> 2xx for any ACTIVE authenticated user
#   /_sub2api_admin_auth  -> 2xx only when server-side role validation proves
#                            the caller is an administrator
#
# error_page wiring so auth_request failures surface as 401/403 to the browser:
error_page 401 = @auth_required;
error_page 403 = @auth_forbidden;

location @auth_required {
    default_type text/plain;
    return 401 "authentication required\n";
}

location @auth_forbidden {
    default_type text/plain;
    return 403 "administrator privileges required\n";
}

# ----------------------------------------------------------------------------
# User quota page. Exact match, fixed tag, client query string DROPPED so the
# Sub2API token in ?token=... is never forwarded to raw.githubusercontent.com.
#
# WHY a rewrite instead of a trailing "?" on proxy_pass:
#   raw.githubusercontent.com treats a "token" QUERY PARAMETER as a GitHub-issued
#   raw access token (?token=GHSAT...) and answers 404 when it does not validate
#   (observed live: ?token=231 -> 404, ?TOKEN=231 -> 200, ?user_id=1 -> 200).
#   The "replace query with empty" trailing-? trick on proxy_pass is applied
#   when nginx builds the upstream URL, but any outer gateway/panel in front of
#   this server may re-append the original query, and one leaked ?token=... is
#   enough to break the page. The rewrite below strips the query in the rewrite
#   phase and internally redirects to an `internal` location whose upstream URL
#   is a fixed, query-free constant — no layer can re-attach anything.
# ----------------------------------------------------------------------------
location = /quota.html {
    auth_request /_sub2api_auth;
    rewrite ^ /_quota_html? break;
}

location = /_quota_html {
    internal;

    proxy_pass https://raw.githubusercontent.com/kael-aiur/cpa-quota-pages/v1.0.0/dist/quota.html;

    proxy_ssl_server_name on;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";

    # raw.githubusercontent.com stamps every response with
    #   Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox
    #   X-Frame-Options: deny
    # to discourage hosting sites off it. Proxied as a top-level document, the
    # sandbox token (no allow-scripts) kills ALL script execution and XFO: deny
    # blocks iframe embedding — the page renders its static fallback forever.
    # Hide every GitHub-injected security header so only our own add_header set
    # below reaches the browser.
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Content-Type "text/html; charset=utf-8" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    # frame-ancestors cannot be enforced via meta CSP; the HTTP header is the
    # only effective channel. Use 'self' when the parent iframe is same-origin;
    # otherwise list the explicit Sub2API origin, e.g.
    #   add_header Content-Security-Policy "frame-ancestors https://sub2api.example.com" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}

# ----------------------------------------------------------------------------
# Admin quota page. Same GitHub request hygiene plus the ADMIN auth_request.
# The static HTML parses no roles: /_sub2api_admin_auth (deployment-supplied)
# returning 2xx is the entire admin authorization decision for this entry.
# ----------------------------------------------------------------------------
location = /quota-admin.html {
    auth_request /_sub2api_admin_auth;
    rewrite ^ /_quota_admin_html? break;
}

location = /_quota_admin_html {
    internal;

    proxy_pass https://raw.githubusercontent.com/kael-aiur/cpa-quota-pages/v1.0.0/dist/quota-admin.html;

    proxy_ssl_server_name on;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";

    # Same GitHub-raw header stripping as the user entry — see the comment
    # above /quota.html for why every upstream security header must be hidden.
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Access-Control-Allow-Origin;

    add_header Content-Type "text/html; charset=utf-8" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}

# ----------------------------------------------------------------------------
# CPA management API. The browser path already carries /v0/management/, so the
# trailing slash on proxy_pass strips ONLY the matched /cpa/ prefix:
#   /cpa/v0/management/api-call  ->  http://cpa_backend/v0/management/api-call
# Do NOT add /v0/management/ to proxy_pass — that would duplicate it.
# ----------------------------------------------------------------------------
location /cpa/ {
    # Validate the browser's Sub2API Bearer token first.
    auth_request /_sub2api_auth;

    # Server-local secret file (never in Git): injects the CPA management key
    # as the upstream Authorization, overriding whatever the browser sent.
    include /etc/nginx/secrets/cpa-management-auth.conf;

    proxy_pass http://cpa_backend/;
}
